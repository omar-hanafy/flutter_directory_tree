name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its superseded run. Each pushed commit
# gets its own group, so a run for main or dev is never canceled or replaced
# while pending.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-stable:
    name: CI / Test on stable
    runs-on: ubuntu-latest
    # A hung test fails in minutes instead of holding a runner for hours. Web
    # and Wasm compilation make this job the slowest one.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # main carries stable versions only and dev prerelease versions only.
      # Checked on every pull request into, and push to, either lane, not only
      # when pubspec.yaml changed, so a lane can never hold the wrong channel.
      - name: Version channel check
        if: >-
          (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'dev')) ||
          (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dev'))
        env:
          TARGET_LANE: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '/^version:/ {print $2; exit}' pubspec.yaml | tr -d "\"'")
          stable_pattern='^[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$'
          prerelease_pattern='^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+(\+[0-9A-Za-z.-]+)?$'
          if [[ "$TARGET_LANE" == 'main' && ! "$version" =~ $stable_pattern ]]; then
            echo "main requires a stable semantic version, got $version."
            exit 1
          fi
          if [[ "$TARGET_LANE" == 'dev' && ! "$version" =~ $prerelease_pattern ]]; then
            echo "dev requires a prerelease semantic version (e.g. -dev.1), got $version."
            exit 1
          fi
          echo "Version $version fits the $TARGET_LANE lane."

      # Development resolves the unreleased directory_tree through
      # pubspec_overrides.yaml files that point at a local checkout. Both lanes
      # publish what they tag, so they must resolve from pub.dev exactly as
      # users do: no overrides files, no path, git, or override dependencies.
      # Runs before dependency resolution, which a developer-machine path
      # breaks; plain `dart <script>` (unlike `dart run`) resolves nothing.
      - name: Release dependencies check
        if: >-
          (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'dev')) ||
          (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dev'))
        run: dart tool/check_repo.dart --release

      # Also resolves example/.
      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # Every enabled lint is a gate, not a suggestion.
      - name: Analyze
        run: flutter analyze --fatal-infos

      # Proves every lib/fix_data.yaml transform against the test_fixes/
      # goldens (each input compiles against 1.0.0; see AGENTS.md).
      - name: Verify dart fix migrations
        run: dart fix test_fixes --compare-to-golden

      - name: Repository checks
        run: dart run tool/check_repo.dart

      - name: Test (VM)
        run: flutter test

      # The main library promises identical behavior on the web. Suites marked
      # @TestOn('vm') (the dart:io file system loader) are skipped there.
      - name: Test compiled to JavaScript (Chrome)
        run: flutter test --platform chrome

      - name: Test compiled to WebAssembly (Chrome)
        run: flutter test --platform chrome --wasm

      # The root steps already resolve and analyze example/; these name the
      # example as its own package, the way users build it.
      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze example
        working-directory: example
        run: flutter analyze --fatal-infos

      - name: Test example
        if: hashFiles('example/test/**') != ''
        working-directory: example
        run: flutter test

      # Every package under benchmark/ is analyzed, and the fast correctness
      # and complexity tests in its test/ folder run. Timing runs live outside
      # test/ and never run in CI.
      - name: Analyze and test benchmarks
        if: hashFiles('benchmark/**/pubspec.yaml') != ''
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' pubspec; do
            package_dir=$(dirname "$pubspec")
            echo "::group::$package_dir"
            (
              cd "$package_dir"
              # Pure Dart packages (workloads, runners) use the Dart tools.
              tool=dart
              if grep -Eq '^[[:space:]]+sdk:[[:space:]]*flutter' pubspec.yaml; then
                tool=flutter
              fi
              flutter pub get
              "$tool" analyze --fatal-infos
              if [[ -d test ]]; then
                "$tool" test
              fi
            )
            echo '::endgroup::'
          done < <(find benchmark -name pubspec.yaml -not -path '*/.dart_tool/*' -not -path '*/build/*' -print0 | sort -z)

  test-minimum:
    name: CI / Test on minimum SDK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The flutter constraint in pubspec.yaml.
      - name: Setup Flutter (minimum supported)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Flutter version
        run: flutter --version

      # Proves the lower bounds in pubspec.yaml still compile and pass.
      - name: Resolve lowest supported dependencies
        run: flutter pub downgrade

      # Infos are fatal on stable only: other SDKs report different infos.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  # Desktop file systems and keyboards differ from Linux: the dart:io loader
  # meets real drive letters, backslashes, and case-insensitive names here.
  # Not required checks, so a runner outage cannot block a release; a red run
  # still blocks review.
  test-windows:
    name: CI / Test on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Git for Windows checks text files out with CRLF line endings. Tests
      # that read repository files must see the committed LF bytes, as on
      # every other runner.
      - name: Check out text files with LF line endings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Test (VM)
        run: flutter test

  test-macos:
    name: CI / Test on macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Test (VM)
        run: flutter test

  test-beta:
    name: CI / Test on beta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter (beta)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: beta
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  pana:
    name: CI / Pana
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Pinned so a pana release cannot change the gate between two runs of
      # the same commit; bump it deliberately.
      - name: Install pana
        run: dart pub global activate pana 0.23.19

      # pana finds Flutter through --flutter-sdk or FLUTTER_ROOT, never PATH;
      # without either it analyzes this Flutter package with the plain Dart
      # SDK. subosito/flutter-action exports FLUTTER_ROOT.
      - name: Run pana (full score required)
        shell: bash
        run: pana --flutter-sdk "${FLUTTER_ROOT:?subosito/flutter-action exports FLUTTER_ROOT}" --exit-code-threshold 0 .
