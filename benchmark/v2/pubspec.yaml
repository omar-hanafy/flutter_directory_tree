name: fdt_bench_v2
description: >-
  Benchmarks the flutter_directory_tree 2.0.0 code in this repository as a
  macOS app (AOT, profile mode) and as a widget test (JIT).
publish_to: none
version: 2.0.0

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.7"

dependencies:
  fdt_bench_harness:
    path: ../harness
  fdt_bench_workloads:
    path: ../workloads
  flutter:
    sdk: flutter
  # The code under test: this repository's root package. Its own
  # pubspec_overrides.yaml does not apply here; see the one next to this file.
  flutter_directory_tree:
    path: ../..

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
